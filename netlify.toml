[build]
  command = "npm run build"
  publish = "build/"

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/experience/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/interests/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
